<script type="text/javascript">
// <![CDATA[
	var form_name = 'postform';
	var text_name = <!-- IF $SIG_EDIT -->'signature'<!-- ELSE -->'message'<!-- ENDIF -->;
	var load_draft = false;
	var upload = false;

	// Define the bbCode tags
	var bbcode = new Array();
	var bbtags = new Array('[b]','[/b]','[i]','[/i]','[u]','[/u]','[quote]','[/quote]','[code]','[/code]','[list]','[/list]','[list=]','[/list]','[img]','[/img]','[url]','[/url]','[flash=]', '[/flash]','[size=]','[/size]'<!-- BEGIN custom_tags -->, {custom_tags.BBCODE_NAME}<!-- END custom_tags -->);
	var imageTag = false;

	// Helpline messages
	var help_line = {
		b: '{LA_BBCODE_B_HELP}',
		i: '{LA_BBCODE_I_HELP}',
		u: '{LA_BBCODE_U_HELP}',
		q: '{LA_BBCODE_Q_HELP}',
		c: '{LA_BBCODE_C_HELP}',
		l: '{LA_BBCODE_L_HELP}',
		o: '{LA_BBCODE_O_HELP}',
		p: '{LA_BBCODE_P_HELP}',
		w: '{LA_BBCODE_W_HELP}',
		a: '{LA_BBCODE_A_HELP}',
		s: '{LA_BBCODE_S_HELP}',
		f: '{LA_BBCODE_F_HELP}',
		y: '{LA_BBCODE_Y_HELP}',
		d: '{LA_BBCODE_D_HELP}'
		<!-- BEGIN custom_tags -->
			,cb_{custom_tags.BBCODE_ID}: '{custom_tags.A_BBCODE_HELPLINE}'
		<!-- END custom_tags -->
	}

	function change_palette()
	{
		phpbb.toggleDisplay('colour_palette');
		e = document.getElementById('colour_palette');

		if (e.style.display == 'block')
		{
			document.getElementById('bbpalette').value = '{LA_FONT_COLOR_HIDE}';
		}
		else
		{
			document.getElementById('bbpalette').value = '{LA_FONT_COLOR}';
		}
	}


// ]]>
</script>
<!-- INCLUDEJS {T_ASSETS_PATH}/javascript/editor.js -->
<!-- IF not S_VISUAL_EDITOR -->
	<!-- IF S_BBCODE_ALLOWED -->
		<div id="colour_palette" style="display: none;">
			<dl style="clear: left;">
				<dt><label>{L_FONT_COLOR}:</label></dt>
				<dd id="color_palette_placeholder" data-orientation="h" data-height="12" data-width="15" data-bbcode="true"></dd>
			</dl>
		</div>
		<!-- EVENT posting_editor_buttons_before -->
		<div id="format-buttons" class="no-margin">
			<div class="btn-toolbar" role="toolbar">
				<div class="btn-group btn-group-sm">
					<button onclick="bbstyle(0)" title="{L_BBCODE_B_HELP}" accesskey="b" name="addbbcode0" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-bold fa-lg fa-fw" aria-hidden="true"></i>
					</button>
					<button onclick="bbstyle(2)" title="{L_BBCODE_I_HELP}" accesskey="i" name="addbbcode2" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-italic fa-lg fa-fw" aria-hidden="true"></i>
					</button>
					<button onclick="bbstyle(4)" title="{L_BBCODE_U_HELP}" accesskey="u" name="addbbcode4" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-underline fa-lg fa-fw" aria-hidden="true"></i>
					</button>
				</div>
				<!-- IF S_BBCODE_QUOTE -->
					<div class="btn-group btn-group-sm">
						<button onclick="bbstyle(6)" title="{L_BBCODE_Q_HELP}" accesskey="q" name="addbbcode6" type="button" class="btn btn-default btn-xs" >
							<i class="fa fa-quote-right fa-lg fa-fw" aria-hidden="true"></i>
						</button>
					</div>
				<!-- ENDIF -->
				<div class="btn-group btn-group-sm">
					<button onclick="bbstyle(10)" title="{L_BBCODE_L_HELP}" accesskey="l" name="addbbcode10" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-list-ul fa-lg fa-fw" aria-hidden="true"></i>
					</button>
					<button onclick="bbstyle(12)" title="{L_BBCODE_O_HELP}" accesskey="o" name="addbbcode12" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-list-ol fa-lg fa-fw" aria-hidden="true"></i>
					</button>
					<button onclick="bbstyle(-1)" title="{L_BBCODE_LISTITEM_HELP}" accesskey="y" name="addbblistitem" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-asterisk fa-lg fa-fw" aria-hidden="true"></i>
					</button>
				</div>
				<div class="btn-group btn-group-sm">
					<button onclick="bbstyle(8)" title="{L_BBCODE_C_HELP}" accesskey="c" name="addbbcode8" type="button" class="btn btn-default btn-xs" >
						<i class="fa fa-code fa-lg fa-fw" aria-hidden="true"></i>
					</button>
					<!-- IF S_BBCODE_IMG -->
						<button onclick="bbstyle(14)" title="{L_BBCODE_P_HELP}" accesskey="p" name="addbbcode14" type="button" class="btn btn-default btn-xs" >
							<i class="fa fa-picture-o fa-lg fa-fw" aria-hidden="true"></i>
						</button>
					<!-- ENDIF -->
					<!-- IF S_LINKS_ALLOWED -->
						<button onclick="bbstyle(16)" title="{L_BBCODE_W_HELP}" accesskey="w" name="addbbcode16" type="button" class="btn btn-default btn-xs" >
							<i class="fa fa-link fa-lg fa-fw" aria-hidden="true"></i>
						</button>
					<!-- ENDIF -->
					<!-- IF S_BBCODE_FLASH -->
						<button onclick="bbstyle(18)" title="{L_BBCODE_D_HELP}" accesskey="d" name="addbbcode18" type="button" class="btn btn-default btn-xs" >
							<i class="fa fa-flash fa-lg fa-fw" aria-hidden="true"></i>
						</button>
					<!-- ENDIF -->
					<button onclick="change_palette();" title="{L_BBCODE_S_HELP}" name="bbpalette" type="button" class="btn btn-default btn-xs" id="bbpalette" value="{L_FONT_COLOR}"    >
						<i class="fa fa-tint fa-lg fa-fw" aria-hidden="true"></i>
					</button>
				</div>
				<div class="btn-group btn-group-sm fontsize-picker">
					<select name="addbbcode20" class="form-control" onchange="bbfontstyle('[size=' + this.form.addbbcode20.options[this.form.addbbcode20.selectedIndex].value + ']', '[/size]');this.form.addbbcode20.selectedIndex = 2;" title="{L_BBCODE_F_HELP}">
						<option value="50">{L_FONT_TINY}</option>
						<option value="85">{L_FONT_SMALL}</option>
						<option value="100" selected="selected">{L_FONT_NORMAL}</option>
						<!-- IF not MAX_FONT_SIZE or MAX_FONT_SIZE >= 150 -->
							<option value="150">{L_FONT_LARGE}</option>
							<!-- IF not MAX_FONT_SIZE or MAX_FONT_SIZE >= 200 -->
								<option value="200">{L_FONT_HUGE}</option>
							<!-- ENDIF -->
						<!-- ENDIF -->
					</select>
				</div>
				<!-- EVENT posting_editor_buttons_custom_tags_before -->
				<!-- BEGIN custom_tags -->
					<button onclick="bbstyle({custom_tags.BBCODE_ID})" title="{custom_tags.BBCODE_HELPLINE}" name="addbbcode{custom_tags.BBCODE_ID}" type="button" class="btn btn-default btn-xs bbcode-{custom_tags.BBCODE_TAG_CLEAN}" value="{custom_tags.BBCODE_TAG}"  >
						{custom_tags.BBCODE_TAG}
					</button>
				<!-- END custom_tags -->
				<!-- IF S_SHOW_ATTACH_BOX and not S_PRIVMSGS -->
					<span class="gpx-editor-wrap">
						<button type="button" class="btn btn-default btn-xs bbcode-gpx" id="gpx-editor-button"
							title="{L_GPX_BUTTON_EXPLAIN}" data-title-edit="{L_GPX_BUTTON_EDIT_EXPLAIN}"
							aria-haspopup="true" aria-expanded="false" aria-controls="gpx-editor-panel">
							<svg class="gpx-editor-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<circle cx="5" cy="19" r="2" fill="currentColor"/>
								<path d="M5 19c3-1 3-5 7-5s4-4 1-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.2"/>
								<path d="M17 2a4 4 0 0 0-4 4c0 3 4 7 4 7s4-4 4-7a4 4 0 0 0-4-4zm0 5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/>
							</svg>
							<span class="sr-only">{L_GPX_BUTTON}</span>
						</button>

						<div class="gpx-editor-panel hidden" id="gpx-editor-panel" role="dialog" aria-label="{L_GPX_PANEL_TITLE}">
							<div class="gpx-editor-head">
								<strong id="gpx-editor-title" data-text-insert="{L_GPX_PANEL_TITLE}" data-text-edit="{L_GPX_PANEL_TITLE_EDIT}">{L_GPX_PANEL_TITLE}</strong>
								<button type="button" class="btn btn-default btn-xs gpx-editor-close" id="gpx-editor-close" title="{L_GPX_PANEL_CLOSE}" aria-label="{L_GPX_PANEL_CLOSE}">&times;</button>
							</div>
							<p class="gpx-editor-hint" id="gpx-editor-hint" data-text-insert="{L_GPX_PANEL_HINT}" data-text-edit="{L_GPX_PANEL_HINT_EDIT}">{L_GPX_PANEL_HINT}</p>
							<div class="gpx-editor-sizes">
								<label for="gpx-editor-map-height">{L_GPX_PANEL_MAP_HEIGHT}</label>
								<input type="number" min="1" max="2000" id="gpx-editor-map-height" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_MAP_HEIGHT_DEFAULT}" />
								<label for="gpx-editor-profile-height">{L_GPX_PANEL_PROFILE_HEIGHT}</label>
								<input type="number" min="1" max="2000" id="gpx-editor-profile-height" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_PROFILE_HEIGHT_DEFAULT}" />
								<label for="gpx-editor-max-zoom">{L_GPX_PANEL_MAX_ZOOM}</label>
								<input type="number" min="1" max="{GPX_PANEL_MAX_ZOOM_DEFAULT}" id="gpx-editor-max-zoom" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_MAX_ZOOM_DEFAULT}" />
							</div>
							<p class="gpx-editor-actions">
								<button type="button" class="btn btn-primary gpx-editor-apply hidden" id="gpx-editor-apply">{L_GPX_PANEL_APPLY}</button>
							</p>
							<ul class="gpx-editor-list hidden" id="gpx-editor-list"></ul>
							<p class="gpx-editor-empty" id="gpx-editor-empty">{L_GPX_PANEL_EMPTY}</p>
							<div class="gpx-editor-upload">
								<label class="btn btn-default gpx-editor-upload-label" for="gpx-editor-file">{L_GPX_PANEL_UPLOAD}</label>
								<input type="file" id="gpx-editor-file" class="gpx-editor-file" accept=".gpx" multiple />
							</div>
						</div>
					</span>
					<!-- INCLUDEJS {T_THEME_PATH}/comboot/gpxeditor.js -->
					<!-- INCLUDECSS {T_THEME_PATH}/comboot/gpxeditor.css -->
				<!-- ENDIF -->
			</div>
		</div>
		<!-- EVENT posting_editor_buttons_after -->
		<!-- ENDIF -->
	<!-- ENDIF -->
