<!-- IF S_SHOW_ATTACH_BOX and not S_PRIVMSGS -->
	<span class="gpx-editor-wrap">
		<button type="button" class="btn btn-default btn-sm bbcode-gpx" id="gpx-editor-button"
			title="{L_GPX_BUTTON_EXPLAIN}" data-title-edit="{L_GPX_BUTTON_EDIT_EXPLAIN}"
			aria-haspopup="true" aria-expanded="false" aria-controls="gpx-editor-panel">
			<svg class="icon gpx-editor-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				<circle cx="5" cy="19" r="2" fill="currentColor"/>
				<path d="M5 19c3-1 3-5 7-5s4-4 1-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.2"/>
				<path d="M17 2a4 4 0 0 0-4 4c0 3 4 7 4 7s4-4 4-7a4 4 0 0 0-4-4zm0 5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/>
			</svg>
			<span class="sr-only">{L_GPX_BUTTON}</span>
		</button>

		<div class="gpx-editor-panel hidden" id="gpx-editor-panel" role="dialog" aria-label="{L_GPX_PANEL_TITLE}">
			<div class="gpx-editor-head">
				<strong id="gpx-editor-title" data-text-insert="{L_GPX_PANEL_TITLE}" data-text-edit="{L_GPX_PANEL_TITLE_EDIT}">{L_GPX_PANEL_TITLE}</strong>
				<button type="button" class="btn btn-default btn-xs gpx-editor-close" id="gpx-editor-close" title="{L_GPX_PANEL_CLOSE}" aria-label="{L_GPX_PANEL_CLOSE}">&times;</button>
			</div>
			<p class="gpx-editor-hint" id="gpx-editor-hint" data-text-insert="{L_GPX_PANEL_HINT}" data-text-edit="{L_GPX_PANEL_HINT_EDIT}">{L_GPX_PANEL_HINT}</p>
			<div class="gpx-editor-sizes">
				<label for="gpx-editor-map-height">{L_GPX_PANEL_MAP_HEIGHT}</label>
				<input type="number" min="1" max="2000" id="gpx-editor-map-height" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_MAP_HEIGHT_DEFAULT}" />
				<label for="gpx-editor-profile-height">{L_GPX_PANEL_PROFILE_HEIGHT}</label>
				<input type="number" min="1" max="2000" id="gpx-editor-profile-height" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_PROFILE_HEIGHT_DEFAULT}" />
				<label for="gpx-editor-max-zoom">{L_GPX_PANEL_MAX_ZOOM}</label>
				<input type="number" min="1" max="{GPX_PANEL_MAX_ZOOM_DEFAULT}" id="gpx-editor-max-zoom" class="gpx-editor-size form-control" placeholder="{GPX_PANEL_MAX_ZOOM_DEFAULT}" />
			</div>
			<p class="gpx-editor-actions">
				<button type="button" class="btn btn-primary gpx-editor-apply hidden" id="gpx-editor-apply">{L_GPX_PANEL_APPLY}</button>
			</p>
			<ul class="gpx-editor-list hidden" id="gpx-editor-list"></ul>
			<p class="gpx-editor-empty" id="gpx-editor-empty">{L_GPX_PANEL_EMPTY}</p>
			<div class="gpx-editor-upload">
				<label class="btn btn-default gpx-editor-upload-label" for="gpx-editor-file">{L_GPX_PANEL_UPLOAD}</label>
				<input type="file" id="gpx-editor-file" class="gpx-editor-file" accept=".gpx" multiple />
			</div>
		</div>
	</span>

	<!-- INCLUDEJS @wf_gpxviewer/gpxeditor.js -->
	<!-- INCLUDECSS @wf_gpxviewer/gpxeditor.css -->
<!-- ENDIF -->
<!-- IF S_BOARDRULES_AT_REGISTRATION and not S_SHOW_COPPA -->
	<p>{L_BOARDRULES_AGREEMENT}{L_COLON} <a href="{U_BOARDRULES}" title="{L_BOARDRULES_TITLE}" target="_blank"><strong>{L_BOARDRULES_TITLE}</strong></a></p>
<!-- ENDIF -->
